<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="將網址轉成 QR Code，下載圖片，或從 QR Code 圖片讀取網址。" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
    <title>URL ↔ QR Code</title>
  </head>
  <body>
    <a class="skip-link" tabindex="0" href="#converter">跳至轉換工具</a>
    <div class="page-shell">
      <header class="intro">
        <h1>URL <span class="direction">↔</span> QR Code</h1>
      </header>
      <main id="converter" tabindex="-1">
        <div class="mode-switch" role="tablist" aria-label="轉換模式">
          <button id="encode-tab" type="button" role="tab" aria-selected="true" aria-controls="encode-panel" tabindex="0">URL → QR Code</button>
          <button id="decode-tab" type="button" role="tab" aria-selected="false" aria-controls="decode-panel" tabindex="-1">QR Code → URL</button>
        </div>
        <div class="workspace">
          <section id="encode-panel" role="tabpanel" aria-labelledby="encode-tab" tabindex="0">
            <div class="converter-grid">
              <div class="input-section">
                <label for="url-input">網址 <span lang="en">URL</span></label>
                <input id="url-input" name="url" type="url" inputmode="url" placeholder="example.com" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="url-hint url-error" />
                <p id="url-hint" class="field-hint">可省略 https://</p>
                <p id="url-error" class="error-message" role="alert" aria-atomic="true"></p>
                <button id="generate-button" class="button primary-button" type="button" disabled>產生 QR Code</button>
              </div>
              <div class="output-section">
                <h2 id="preview-title">QR Code 預覽</h2>
                <div id="qr-preview">
                  <div id="qr-placeholder" class="preview-placeholder"><p>尚未產生 QR Code</p></div>
                  <div id="qr-image-container"></div>
                </div>
                <p id="qr-status" class="field-hint" role="status" aria-atomic="true"></p>
                <p id="qr-error" class="error-message" role="alert" aria-atomic="true"></p>
                <div id="download-control" class="download-control">
                  <div class="download-split">
                    <button id="download-button" autocomplete="off" class="button secondary-button" type="button" disabled aria-describedby="qr-status qr-error">Download PNG</button>
                    <button id="download-toggle" autocomplete="off" class="button secondary-button" type="button" disabled aria-label="其他下載格式" aria-expanded="false" aria-controls="download-menu" aria-haspopup="menu"><span aria-hidden="true">▾</span></button>
                  </div>
                  <div id="download-menu" role="menu" aria-label="下載格式" hidden>
                    <button type="button" role="menuitem" tabindex="-1" data-format="svg">Download SVG</button>
                    <button type="button" role="menuitem" tabindex="-1" data-format="jpg">Download JPG</button>
                    <button type="button" role="menuitem" tabindex="-1" data-format="webp">Download WebP</button>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <section id="decode-panel" role="tabpanel" aria-labelledby="decode-tab" tabindex="0" hidden>
            <div class="converter-grid">
              <div class="input-section">
                <div id="image-drop-zone" class="image-drop-zone">
                  <label for="qr-image">選擇圖片或拖曳到這裡</label>
                  <input id="qr-image" name="qr-image" type="file" accept="image/*" aria-describedby="image-hint decode-error" />
                  <p id="image-hint" class="field-hint">一次一張，最大 20 MiB</p>
                </div>
              </div>
              <div class="output-section">
                <p id="result-hint" class="field-hint result-status" role="status" aria-atomic="true"></p>
                <label for="decoded-url">網址 <span lang="en">URL</span></label>
                <div class="result-field">
                  <textarea id="decoded-url" rows="3" readonly autocomplete="off" placeholder="尚未找到網址" aria-describedby="result-hint decode-error"></textarea>
                  <button id="copy-button" autocomplete="off" class="button icon-button" type="button" disabled aria-label="複製網址" title="複製網址" aria-describedby="result-hint decode-error">
                    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>
                  </button>
                </div>
                <p id="decode-error" class="error-message" role="alert" aria-atomic="true"></p>
                <a id="open-link" class="button secondary-button open-link" target="_blank" rel="noopener noreferrer" hidden>開啟連結</a>
              </div>
            </div>
          </section>
        </div>
        <noscript><p class="noscript-note">請啟用 JavaScript 以使用轉換工具。</p></noscript>
      </main>
    </div>
  </body>
</html>
